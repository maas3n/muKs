name: Complete private muKsMaTT v.0.0.2 Linux release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-v0.0.2-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-muksmatt-v0.0.2
  cancel-in-progress: false

jobs:
  complete-release:
    name: Repackage verified PR#1 GUI in every Linux distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out private muKs repository
        uses: actions/checkout@v4

      - name: Install standalone runtime verification prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dri libgl1 libx11-6 libxcursor1 libxrandr2 \
            libxinerama1 libxi6 libxkbcommon0 libwayland-client0 \
            libbluray2 libaacs0 libbdplus0 libudfread0

      - name: Download original v.0.0.1 packages from this private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          gh release download v.0.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'muKsMaTT-0.0.0-dev-Linux-amd64.deb' \
            --pattern 'muKsMaTT-0.0.0-dev-Linux-amd64.tar.gz' \
            --pattern 'muKsMaTT-0.0.0-dev-Source.tar.gz' \
            --pattern 'muKsMaTT-0.0.0-dev-Linux-Library-Sources.tar.gz' \
            --dir "$RUNNER_TEMP/original"
          test "$(find "$RUNNER_TEMP/original" -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Download exact previously tested v.0.0.2 standalone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tested"
          gh release download v.0.0.2 --repo "$GITHUB_REPOSITORY" \
            --pattern 'muKsMaTT-0.0.2-PR1-Linux-amd64Standalone' \
            --pattern 'SHA256SUMS.txt' \
            --dir "$RUNNER_TEMP/tested"
          cd "$RUNNER_TEMP/tested"
          sha256sum -c SHA256SUMS.txt
          chmod +x muKsMaTT-0.0.2-PR1-Linux-amd64Standalone
          echo "Confirmed exact previously tested v0.0.2 standalone"

      - name: Extract the tested GUI from the approved standalone
        run: |
          set -euo pipefail
          XDG_CACHE_HOME="$RUNNER_TEMP/pr1-cache" \
            "$RUNNER_TEMP/tested/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone" \
            --standalone-self-test
          gui="$(find "$RUNNER_TEMP/pr1-cache/muksmatt/standalone" \
            -type f -name muksmatt-bin -print -quit)"
          test -n "$gui"
          test -s "$gui"
          echo "GUI_BINARY=$gui" >> "$GITHUB_ENV"
          sha256sum "$gui"

      - name: Repackage Debian, portable tarball, patched source, library sources and dev ZIP
        run: |
          set -euo pipefail
          python3 scripts/complete-v0.0.2-release.py \
            --original "$RUNNER_TEMP/original" \
            --tested-standalone "$RUNNER_TEMP/tested/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone" \
            --gui "$GUI_BINARY" \
            --patch patches/advanced-dvd-mux-mkv-only.patch \
            --out "$RUNNER_TEMP/complete-release"
          cd "$RUNNER_TEMP/complete-release"
          sha256sum -c SHA256SUMS.txt

      - name: Upload all missing packages into the EXISTING private v.0.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/complete-release"
          gh release upload v.0.0.2 \
            "$dist/muKsMaTT-0.0.2-Linux-amd64.deb" \
            "$dist/muKsMaTT-0.0.2-Linux-amd64.tar.gz" \
            "$dist/muKsMaTT-0.0.2-Source.tar.gz" \
            "$dist/muKsMaTT-0.0.2-Linux-Library-Sources.tar.gz" \
            "$dist/muKsMaTT-Linux-amd64-dev.zip" \
            "$dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update release notes describing approved UI-only change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<'EOF'
          muKsMaTT v.0.0.2 — approved ADVANCED-tab UI fix (PR#1)

          - ADVANCED > DVD > MUX offers MKV only.
          - Blu-ray and other non-DVD inputs preserve existing MUX format options.
          - REMUX/DEMUX, BATCH, CLI and all media-engine functionality are unchanged.
          - All Linux distributions use the exact GUI extracted from the standalone already tested in PR#1.
          - The Debian and portable packages retain all original v.0.0.1 CLI, FFmpeg, MediaInfo and disc-processing binaries byte-for-byte.
          - Source package contains the approved Linux ADVANCED UI patch and regression tests.
          - Library sources are unchanged from v.0.0.1; they are republished unmodified for completeness.
          - The development ZIP contains the updated complete Linux distribution set.
          - SHA256SUMS.txt verifies every release asset, including the development ZIP.

          Private pre-release. Published after successful PR#1 testing and owner approval.
          EOF
          gh release edit v.0.0.2 --repo "$GITHUB_REPOSITORY" \
            --title 'muKsMaTT v.0.0.2' --prerelease \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Verify remote release has exactly the complete seven-asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v.0.0.2" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          rel=json.load(open(os.environ['RUNNER_TEMP']+'/release.json'))
          dist=pathlib.Path(os.environ['RUNNER_TEMP'])/'complete-release'
          actual={a['name']:a for a in rel['assets']}
          expected={p.name for p in dist.iterdir() if p.is_file()}
          if set(actual)!=expected:
              raise RuntimeError(f'Release mismatch: missing={expected-set(actual)} extra={set(actual)-expected}')
          for name in sorted(expected):
              asset=actual[name]
              local=dist/name
              if asset['size']!=local.stat().st_size: raise RuntimeError(f'Wrong remote asset size: {name}')
              digest=asset.get('digest')
              if digest:
                  h=hashlib.sha256()
                  with local.open('rb') as f:
                      for chunk in iter(lambda: f.read(4*1024*1024), b''): h.update(chunk)
                  if digest!='sha256:'+h.hexdigest(): raise RuntimeError(f'Wrong remote SHA256: {name}')
              print(name,'verified',asset['size'],digest or '(no remote digest)')
          print('Complete muKsMaTT v.0.0.2 release verified')
          PY
