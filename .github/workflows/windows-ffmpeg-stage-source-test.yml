name: Windows FFmpeg smoke-stage — native source regression (NO MEDIA ASSETS)

on:
  push:
    branches: [port/windows-parity-v0.0.3]
    paths:
      - .github/workflows/windows-ffmpeg-stage-source-test.yml
      - scripts/apply-windows-ffmpeg-stage.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated Windows test scripts
        uses: actions/checkout@v4

      - name: Configure native Windows Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Download verified Linux v0.0.3 source and apply Windows-only FFmpeg stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'muksmatt-source'
          New-Item -ItemType Directory -Force $root | Out-Null
          gh release download v0.0.3 --repo $env:GITHUB_REPOSITORY --pattern muKsMaTT-0.0.3-Source.tar.gz --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          $archive = Join-Path $root 'muKsMaTT-0.0.3-Source.tar.gz'
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne 'd36d9e4128d0a9432d3da4916c5de7777208f0faf578d83b7f6c24055b5cbe10') {
            throw "Unexpected exact Linux source archive SHA256: $hash"
          }
          tar -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          $src = Join-Path $root 'muKsMaTT-0.0.3-Source'
          python scripts/apply-windows-ffmpeg-stage.py $src
          if ($LASTEXITCODE -ne 0) { throw 'Windows-only tool resolver patch failed' }
          "MUKS_SOURCE=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Native Windows Go unit and CLI tests, plus vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:MUKS_SOURCE 'src')
          $env:CGO_ENABLED = '0'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows unit tests failed' }
          go test -tags cli -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows CLI tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows go vet failed' }

      - name: Build GUI and console CLI and verify original routes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'dist-app'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Set-Location (Join-Path $env:MUKS_SOURCE 'src')
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags '-s -w -H=windowsgui -X main.appVersion=0.0.3-ffmpeg-stage-test' -o (Join-Path $dest 'muksmatt.exe') .
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI failed to build' }
          go build -tags cli -trimpath -buildvcs=false -ldflags '-s -w -X main.appVersion=0.0.3-ffmpeg-stage-test' -o (Join-Path $dest 'muksmatt-cli.exe') .
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI failed to build' }
          $cli = Join-Path $dest 'muksmatt-cli.exe'
          $version = (& $cli --version | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not $version.Contains('0.0.3-ffmpeg-stage-test')) { throw 'Wrong Windows CLI version' }
          $help = (& $cli --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI help failed' }
          foreach ($token in @('scan SOURCE','demux','advanced demux','bluray scan','bluray remux','bluray demux')) {
            if (-not $help.Contains($token)) { throw "Missing original CLI command: $token" }
          }

      - name: GUI startup smoke test — no runtime assets or downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist-app'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $p = Start-Process (Join-Path $stage 'muksmatt.exe') -WorkingDirectory $stage -PassThru
          try {
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited) { throw "GUI exited early: $($p.ExitCode)" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Upload private Windows application-only regression binaries
        uses: actions/upload-artifact@v4
        with:
          name: muKsMaTT-Windows-FFmpeg-Stage-APP-ONLY
          path: dist-app/
          retention-days: 14
          if-no-files-found: error
