name: PR#2 private DVD DEMUX CLI test

on:
  push:
    branches:
      - feature/dvd-demux-cli-main-advanced
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-standalone:
    name: Test both DVD CLI paths and build private standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out muKs CLI patch
        uses: actions/checkout@v4

      - name: Install Linux GUI and authored DVD test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ pkg-config xvfb xorg-dev libgl1-mesa-dev libgl1-mesa-dri \
            libwayland-dev libxkbcommon-dev libbluray-dev libaacs0 libbdplus0 libudfread0 \
            dvdauthor ffmpeg

      - name: Install release-compatible Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Download and verify private v.0.0.2 source and tested standalone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/src-tree"
          gh release download v.0.0.2 --repo "$GITHUB_REPOSITORY" \
            --pattern 'muKsMaTT-0.0.2-Source.tar.gz' \
            --pattern 'muKsMaTT-0.0.2-PR1-Linux-amd64Standalone' \
            --dir "$RUNNER_TEMP/release"
          printf '%s  %s\n' \
            'dc1d6e124b2087e421485718fb6e42406ff467a51629005966f70153d3db3057' \
            "$RUNNER_TEMP/release/muKsMaTT-0.0.2-Source.tar.gz" | sha256sum -c -
          printf '%s  %s\n' \
            '674e510479bae54026b9ca522f7b3a5d4dab7cdef6947c8a0cb166b7601acc9d' \
            "$RUNNER_TEMP/release/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/release/muKsMaTT-0.0.2-Source.tar.gz" -C "$RUNNER_TEMP/src-tree"

      - name: Apply reviewed CLI/UI changes without changing the engine
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src-tree/muKsMaTT-0.0.2-Source"
          test -f "$src/src/desktop_cli.go"
          python3 scripts/apply-dvd-demux-cli.py "$src"
          test -f "$src/src/desktop_cli_dvd_demux.go"
          printf 'SOURCE_ROOT=%s\n' "$src" >> "$GITHUB_ENV"

      - name: Run DVD CLI unit and direct demux regression tests
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/src"
          go test -tags cli -run '^(TestDVDCLI|TestAdvancedMergerDemuxInputPolicy|TestAdvancedMergerDemuxOpensOriginalDVDSource|TestDesktopCLIArguments)' -count=1 .

      - name: Build both updated executables, without engine source modifications
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiled"
          cd "$SOURCE_ROOT/src"
          go build -trimpath -ldflags '-s -w -X main.appVersion=0.0.2-pr2' \
            -o "$RUNNER_TEMP/compiled/muksmatt-bin" .
          go build -tags cli -trimpath -ldflags '-s -w -X main.appVersion=0.0.2-pr2' \
            -o "$RUNNER_TEMP/compiled/muksmatt-cli-bin" .
          "$RUNNER_TEMP/compiled/muksmatt-cli-bin" --help | grep -F 'advanced demux'
          "$RUNNER_TEMP/compiled/muksmatt-cli-bin" --help | grep -F 'muksmatt-cli demux'

      - name: Verify and extract v.0.0.2 standalone runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-cache"
          chmod +x "$RUNNER_TEMP/release/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone"
          XDG_CACHE_HOME="$RUNNER_TEMP/original-cache" \
            "$RUNNER_TEMP/release/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone" --standalone-self-test
          source_dir="$(find "$RUNNER_TEMP/original-cache/muksmatt/standalone" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"
          test -f "$source_dir/muksmatt-bin"
          test -f "$source_dir/muksmatt-cli-bin"
          test -f "$source_dir/ffmpeg"
          printf 'ORIGINAL_PAYLOAD=%s\n' "$source_dir" >> "$GITHUB_ENV"

      - name: Repack only GUI and CLI, preserving original media binaries
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/standalone-stage"
          mkdir -p "$stage/payload" "$GITHUB_WORKSPACE/dist"
          cp -a "$ORIGINAL_PAYLOAD/." "$stage/payload/"
          install -m 0755 "$RUNNER_TEMP/compiled/muksmatt-bin" "$stage/payload/muksmatt-bin"
          install -m 0755 "$RUNNER_TEMP/compiled/muksmatt-cli-bin" "$stage/payload/muksmatt-cli-bin"
          while IFS= read -r -d '' file; do
            relative="$(realpath --relative-to="$ORIGINAL_PAYLOAD" "$file")"
            case "$relative" in
              muksmatt-bin|muksmatt-cli-bin) continue ;;
            esac
            cmp "$file" "$stage/payload/$relative"
          done < <(find "$ORIGINAL_PAYLOAD" -type f -print0)
          cp "$SOURCE_ROOT/packaging/linux/standalone/main.go" "$stage/main.go"
          printf 'module muksmatt-standalone\n\ngo 1.27.1\n' > "$stage/go.mod"
          ( cd "$stage" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -trimpath -ldflags '-s -w -X main.appVersion=0.0.2-pr2' \
              -o "$GITHUB_WORKSPACE/dist/muKsMaTT-0.0.2-PR2-DVD-CLI-Linux-amd64Standalone" . )
          chmod 755 "$GITHUB_WORKSPACE/dist/muKsMaTT-0.0.2-PR2-DVD-CLI-Linux-amd64Standalone"

      - name: End-to-end DVD test of both CLI commands, no intermediate MKV
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          standalone="./muKsMaTT-0.0.2-PR2-DVD-CLI-Linux-amd64Standalone"
          XDG_CACHE_HOME="$RUNNER_TEMP/pr2-test-cache" "$standalone" --standalone-self-test
          mkdir -p "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/outputs/main" "$RUNNER_TEMP/outputs/advanced"
          python3 "$SOURCE_ROOT/android/native/tests/make-dvd-demux-fixture.py" "$RUNNER_TEMP/fixture"
          dvd="$RUNNER_TEMP/fixture/dvd"
          test -f "$dvd/VIDEO_TS/VIDEO_TS.IFO"
          # Run the actual terminal interface: ./standalone demux and
          # ./standalone advanced demux. NO --cli argument or GUI.
          XDG_CACHE_HOME="$RUNNER_TEMP/pr2-test-cache" timeout 180s "$standalone" demux \
            --title 1 --output "$RUNNER_TEMP/outputs/main" --video mpeg2 "$dvd"
          XDG_CACHE_HOME="$RUNNER_TEMP/pr2-test-cache" timeout 180s "$standalone" advanced demux \
            --title 1 --output "$RUNNER_TEMP/outputs/advanced" --video mpeg2 "$dvd"
          # The previously supported --cli alias must also continue to route.
          XDG_CACHE_HOME="$RUNNER_TEMP/pr2-test-cache" timeout 30s "$standalone" --cli demux --help \
            > "$RUNNER_TEMP/cli-alias-help.txt" 2>&1
          grep -Fq 'Usage: muksmatt-cli demux' "$RUNNER_TEMP/cli-alias-help.txt"
          for mode in main advanced; do
            find "$RUNNER_TEMP/outputs/$mode" -type f -name '*.mpeg2' | grep -q .
            find "$RUNNER_TEMP/outputs/$mode" -type f -name '*.ac3' | grep -q .
            if find "$RUNNER_TEMP/outputs/$mode" -type f -iname '*.mkv' | grep -q .; then
              echo "::error::Unexpected intermediate MKV from $mode DVD DEMUX"
              exit 1
            fi
            echo "$mode DVD DEMUX produced direct elementary video/audio and no MKV"
          done
          ( cd "$GITHUB_WORKSPACE/dist" && sha256sum muKsMaTT-0.0.2-PR2-DVD-CLI-Linux-amd64Standalone > SHA256SUMS.txt )

      - name: Regression — existing CLI commands still run directly via ./standalone
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          standalone="./muKsMaTT-0.0.2-PR2-DVD-CLI-Linux-amd64Standalone"
          cache="$RUNNER_TEMP/pr2-test-cache"
          dvd="$RUNNER_TEMP/fixture/dvd"
          test -f "$dvd/VIDEO_TS/VIDEO_TS.IFO"

          # Verify all existing top-level CLI commands via ./standalone;
          # do not use the GUI or a --cli prefix.
          XDG_CACHE_HOME="$cache" timeout 30s "$standalone" --version > "$RUNNER_TEMP/cli-version.txt"
          grep -Fq 'muKsMaTT CLI ' "$RUNNER_TEMP/cli-version.txt"
          XDG_CACHE_HOME="$cache" timeout 30s "$standalone" --help > "$RUNNER_TEMP/cli-help.txt"
          for preserved in \
            'muksmatt-cli scan SOURCE' \
            'muksmatt-cli metadata' \
            'muksmatt-cli remux' \
            'muksmatt-cli bluray demux' \
            'muksmatt-cli --batch' \
            'muksmatt-cli --version'; do
            grep -Fq "$preserved" "$RUNNER_TEMP/cli-help.txt" || {
              echo "::error::Missing existing CLI usage: $preserved"; exit 1;
            }
          done
          for command in scan metadata remux; do
            XDG_CACHE_HOME="$cache" timeout 30s "$standalone" "$command" --help \
              > "$RUNNER_TEMP/cli-$command-help.txt" 2>&1
            grep -Eiq 'usage|title' "$RUNNER_TEMP/cli-$command-help.txt"
            echo "Original CLI entrypoint $command: OK"
          done
          for subcmd in scan tracks remux demux; do
            XDG_CACHE_HOME="$cache" timeout 30s "$standalone" bluray "$subcmd" --help \
              > "$RUNNER_TEMP/cli-bluray-$subcmd-help.txt" 2>&1
            grep -Eiq 'usage|playlist|output' "$RUNNER_TEMP/cli-bluray-$subcmd-help.txt"
            echo "Original Blu-ray CLI entrypoint $subcmd: OK"
          done
          XDG_CACHE_HOME="$cache" timeout 30s "$standalone" --batch --help \
            > "$RUNNER_TEMP/cli-batch-help.txt" 2>&1
          grep -Fq 'muksmatt-cli --batch' "$RUNNER_TEMP/cli-batch-help.txt"
          for command in tools doctor; do
            XDG_CACHE_HOME="$cache" timeout 60s "$standalone" "$command" \
              > "$RUNNER_TEMP/cli-$command.txt" 2>&1
            grep -Fq 'FFmpeg:' "$RUNNER_TEMP/cli-$command.txt"
            grep -Fq 'FFprobe:' "$RUNNER_TEMP/cli-$command.txt"
          done

          # Real pre-existing metadata and REMUX operations on the DVD fixture.
          XDG_CACHE_HOME="$cache" timeout 180s "$standalone" metadata --title 1 "$dvd" \
            > "$RUNNER_TEMP/cli-metadata.txt"
          test -s "$RUNNER_TEMP/cli-metadata.txt"
          mkdir -p "$RUNNER_TEMP/outputs/original-remux"
          XDG_CACHE_HOME="$cache" timeout 180s "$standalone" remux \
            --title 1 --output "$RUNNER_TEMP/outputs/original-remux" "$dvd"
          find "$RUNNER_TEMP/outputs/original-remux" -type f -iname '*.mkv' -size +0c | grep -q .
          # REMUX intentionally writes MKV; the new DEMUX paths must not.
          for mode in main advanced; do
            if find "$RUNNER_TEMP/outputs/$mode" -type f -iname '*.mkv' | grep -q .; then
              echo "::error::DEMUX $mode unexpectedly produced MKV"; exit 1
            fi
          done
          echo 'PASS: both direct DVD DEMUX modes and all existing terminal CLI routes retained'

      - name: Upload private PR#2 standalone for owner testing (no release)
        uses: actions/upload-artifact@v4
        with:
          name: muKsMaTT-v0.0.2-PR2-DVD-DEMUX-CLI
          path: |
            dist/muKsMaTT-0.0.2-PR2-DVD-CLI-Linux-amd64Standalone
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
