name: Retire superseded Windows PR3 branch

on:
  push:
    branches:
      - port/windows-parity-v0.0.3
    paths:
      - .github/workflows/retire-windows-pr3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-retired-branch:
    name: Delete old PR3 head branch, never touch main
    runs-on: ubuntu-24.04
    steps:
      - name: Verify PR3 is closed and delete its old test branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_repo='maas3n/muKs'
          old='port/windows-v0.0.3-test'
          test "$GITHUB_REPOSITORY" = "$expected_repo"
          test "$(gh api "repos/$expected_repo/pulls/3" --jq .state)" = closed
          test "$(gh api "repos/$expected_repo/pulls/3" --jq .merged)" = false
          test "$(gh api "repos/$expected_repo/pulls/3" --jq .head.ref)" = "$old"
          if gh api "repos/$expected_repo/git/ref/heads/$old" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$expected_repo/git/refs/heads/$old"
          fi
          if gh api "repos/$expected_repo/git/ref/heads/$old" >/dev/null 2>&1; then
            echo '::error::Retired branch still exists'
            exit 1
          fi
          echo 'PASS: PR#3 remains closed; old Windows test branch deleted'
