name: PR#1 private Linux standalone UI test

on:
  push:
    branches:
      - fix/advanced-dvd-mux-mkv-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-standalone:
    name: Build private UI-only standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out muKs patch
        uses: actions/checkout@v4

      - name: Install Linux GUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ pkg-config xvfb xorg-dev libgl1-mesa-dev libgl1-mesa-dri \
            libwayland-dev libxkbcommon-dev libbluray-dev libaacs0 libbdplus0 libudfread0

      - name: Install original build toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Download verified v.0.0.1 release source and standalone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/src-tree"
          gh release download v.0.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern "muKsMaTT-0.0.0-dev-Source.tar.gz" \
            --pattern "muKsMaTT-0.0.0-dev-Linux-amd64Standalone" \
            --dir "$RUNNER_TEMP/release"
          printf '%s  %s\n' \
            '7fb1be2acdae50f71d1522551732e95a073705f74f465f9308e301963e372472' \
            "$RUNNER_TEMP/release/muKsMaTT-0.0.0-dev-Source.tar.gz" | sha256sum -c -
          printf '%s  %s\n' \
            'a97bdcc412d17fa2587c4b13df192efafdb952b8bed8e8bcf86ef0f0715a7bef' \
            "$RUNNER_TEMP/release/muKsMaTT-0.0.0-dev-Linux-amd64Standalone" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/release/muKsMaTT-0.0.0-dev-Source.tar.gz" -C "$RUNNER_TEMP/src-tree"

      - name: Apply only the ADVANCED-tab UI patch and UI tests
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src-tree/muKsMaTT-0.0.0-dev-Source"
          test -f "$src/src/advanced_merger_ui_linux.go"
          patch --directory="$src" -p1 --forward < patches/advanced-dvd-mux-mkv-only.patch
          test -f "$src/src/advanced_mux_format_linux_test.go"
          printf 'SOURCE_ROOT=%s\n' "$src" >> "$GITHUB_ENV"

      - name: Test DVD-only format options, Blu-ray regression and mixed selections
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/src"
          xvfb-run -a go test -run '^TestAdvancedMuxFormatOptions' -count=1 .

      - name: Compile only the patched GUI (engine and CLI unchanged)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiled"
          cd "$SOURCE_ROOT/src"
          go build -trimpath \
            -ldflags "-s -w -X main.appVersion=0.0.2-pr1" \
            -o "$RUNNER_TEMP/compiled/muksmatt-bin" .

      - name: Extract verified original standalone runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/standalone-original-cache"
          chmod +x "$RUNNER_TEMP/release/muKsMaTT-0.0.0-dev-Linux-amd64Standalone"
          XDG_CACHE_HOME="$RUNNER_TEMP/standalone-original-cache" \
            "$RUNNER_TEMP/release/muKsMaTT-0.0.0-dev-Linux-amd64Standalone" --standalone-self-test
          source_dir="$(find "$RUNNER_TEMP/standalone-original-cache/muksmatt/standalone" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"
          test -f "$source_dir/muksmatt-bin"
          test -f "$source_dir/muksmatt-cli-bin"
          test -f "$source_dir/ffmpeg"
          printf 'ORIGINAL_PAYLOAD=%s\n' "$source_dir" >> "$GITHUB_ENV"

      - name: Repack original runtime with GUI-only fix
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/standalone-stage"
          mkdir -p "$stage/payload" "$GITHUB_WORKSPACE/dist"
          cp -a "$ORIGINAL_PAYLOAD/." "$stage/payload/"
          install -m 0755 "$RUNNER_TEMP/compiled/muksmatt-bin" "$stage/payload/muksmatt-bin"
          # Check no other bundled runtime / engine / CLI file was altered.
          while IFS= read -r -d '' file; do
            relative="${file#"$ORIGINAL_PAYLOAD"/}"
            if [ "$relative" != "muksmatt-bin" ]; then
              cmp "$file" "$stage/payload/$relative"
            fi
          done < <(find "$ORIGINAL_PAYLOAD" -type f -print0)
          cp "$SOURCE_ROOT/packaging/linux/standalone/main.go" "$stage/main.go"
          printf 'module muksmatt-standalone\n\ngo 1.27.1\n' > "$stage/go.mod"
          (
            cd "$stage"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -trimpath -ldflags "-s -w -X main.appVersion=0.0.2-pr1" \
              -o "$GITHUB_WORKSPACE/dist/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone" .
          )
          chmod 755 "$GITHUB_WORKSPACE/dist/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone"
          (
            cd "$GITHUB_WORKSPACE/dist"
            sha256sum muKsMaTT-0.0.2-PR1-Linux-amd64Standalone > SHA256SUMS.txt
          )

      - name: Validate standalone components without launching GUI
        run: |
          set -euo pipefail
          XDG_CACHE_HOME="$RUNNER_TEMP/standalone-pr1-test-cache" \
            "$GITHUB_WORKSPACE/dist/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone" --standalone-self-test

      - name: Upload private test build (not a GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: muKsMaTT-v0.0.2-PR1-Linux-amd64Standalone
          path: |
            dist/muKsMaTT-0.0.2-PR1-Linux-amd64Standalone
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
