name: Windows v0.0.3 full Linux-equivalent media runtime — PRIVATE TEST

on:
  push:
    branches:
      - port/windows-parity-v0.0.3
    paths:
      - .github/workflows/windows-parity-build.yml
      - scripts/apply-windows-parity.py
      - scripts/stage-windows-parity-media.py
      - scripts/stage-windows-parity-dlls.py
      - scripts/prepare-windows-parity.ps1
      - scripts/build-native-windows-parity.sh
      - scripts/verify-and-package-windows-parity.ps1
      - patches/windows-parity/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Copyright-free authored DVD for identical Windows media tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install DVD authoring prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dvdauthor ffmpeg

      - name: Download checksum-verified original v0.0.3 fixture generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-src"
          gh release download v0.0.3 --repo "$GITHUB_REPOSITORY" \
            --pattern muKsMaTT-0.0.3-Source.tar.gz --dir "$RUNNER_TEMP/exact-src"
          printf '%s  %s\n' \
            d36d9e4128d0a9432d3da4916c5de7777208f0faf578d83b7f6c24055b5cbe10 \
            "$RUNNER_TEMP/exact-src/muKsMaTT-0.0.3-Source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/exact-src/muKsMaTT-0.0.3-Source.tar.gz" \
            -C "$RUNNER_TEMP/exact-src"
          python3 "$RUNNER_TEMP/exact-src/muKsMaTT-0.0.3-Source/android/native/tests/make-dvd-demux-fixture.py" \
            "$GITHUB_WORKSPACE/fixture"
          test -f "$GITHUB_WORKSPACE/fixture/dvd/VIDEO_TS/VIDEO_TS.IFO"
          test -f "$GITHUB_WORKSPACE/fixture/dvd/VIDEO_TS/VTS_01_1.VOB"

      - name: Upload authored DVD source for Windows terminal end-to-end tests
        uses: actions/upload-artifact@v4
        with:
          name: muKsMaTT-Windows-parity-authored-DVD
          path: fixture/dvd/
          retention-days: 1
          if-no-files-found: error

  windows-parity:
    name: Match Linux tools, test actual Windows DVD, produce private offline ZIP
    runs-on: windows-latest
    timeout-minutes: 120
    needs: fixture
    steps:
      - name: Checkout isolated Windows parity scripts
        uses: actions/checkout@v4

      - name: Install exact Go release compiler
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build and unit-test native Windows GUI/CLI, bundle exact FFmpeg/MediaInfo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/prepare-windows-parity.ps1')
          if (-not $?) { throw 'Verified Windows source/tool bundle preparation failed' }

      - name: Install native C compiler and matching versions of Blu-ray/DVD libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus
            mingw-w64-x86_64-libdvdcss
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-freetype

      - name: Verify signature of historical libbluray 1.3.4 and compile original navigator
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash "$(cygpath -u "$GITHUB_WORKSPACE")/scripts/build-native-windows-parity.sh"

      - name: Download same authored DVD regression fixture for real Windows processing
        uses: actions/download-artifact@v4
        with:
          name: muKsMaTT-Windows-parity-authored-DVD
          path: authored-dvd

      - name: Verify offline media-tool operation, native GUI and all ZIP checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/verify-and-package-windows-parity.ps1')
          if (-not $?) { throw 'Native Windows media parity tests or ZIP verification failed' }

      - name: Save PRIVATE test ZIP only (no merge, tag, or release)
        uses: actions/upload-artifact@v4
        with:
          name: muKsMaTT-v0.0.3-Windows-FULL-PARITY-TEST
          path: |
            dist/muKsMaTT-0.0.3-Windows-amd64-FULL-PARITY-TEST.zip
            dist/WINDOWS-ZIP-SHA256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
